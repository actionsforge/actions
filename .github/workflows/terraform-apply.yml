name: terraform-apply

# OIDC terraform fmt/validate/plan/apply for main-branch deploys.
# Callers must pass secrets explicitly (secrets: inherit is unreliable across orgs).
# Keep concurrency on the caller so plan/apply can share one group.
#
# Expects caller repo:
#   secrets.AWS_ACCOUNT_ID (required)
#   vars.OIDC_ROLE_NAME, vars.AWS_REGION, vars.TERRAFORM_VERSION
# Optional TF_VAR_* secrets (omit when unused): VERCEL_*, *_ACCOUNT_EMAIL,
# BOOTSTRAP_ADMIN_EMAIL, etc.
#
# Optional lock-file commit writes only .terraform.lock.hcl (never git add . / force-push).

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Terraform configuration directory
        type: string
        required: false
        default: "."
      aws-region:
        description: AWS region for OIDC (defaults to vars.AWS_REGION)
        type: string
        required: false
        default: ""
      terraform-version:
        description: Terraform version (defaults to vars.TERRAFORM_VERSION)
        type: string
        required: false
        default: ""
      init-upgrade:
        description: Run terraform init -upgrade
        type: boolean
        required: false
        default: false
      commit-lock-file:
        description: Commit .terraform.lock.hcl changes back to the branch after apply
        type: boolean
        required: false
        default: true
    secrets:
      AWS_ACCOUNT_ID:
        description: AWS account id for the OIDC role ARN
        required: true
      VERCEL_API_TOKEN:
        description: Optional TF_VAR_vercel_api_token
        required: false
      VERCEL_GITHUB_PAT:
        description: Optional TF_VAR_github_pat
        required: false
      SANDBOX_ACCOUNT_EMAIL:
        description: Optional TF_VAR_sandbox_account_email
        required: false
      DEV_ACCOUNT_EMAIL:
        description: Optional TF_VAR_dev_account_email
        required: false
      NETWORK_ACCOUNT_EMAIL:
        description: Optional TF_VAR_network_account_email
        required: false
      SHARED_SERVICES_ACCOUNT_EMAIL:
        description: Optional TF_VAR_shared_services_account_email
        required: false
      BOOTSTRAP_ADMIN_EMAIL:
        description: Optional TF_VAR_bootstrap_admin_email
        required: false

permissions:
  id-token: write
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      # Optional TF_VAR pass-through (blank when secret absent)
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_github_pat: ${{ secrets.VERCEL_GITHUB_PAT }}
      TF_VAR_sandbox_account_email: ${{ secrets.SANDBOX_ACCOUNT_EMAIL }}
      TF_VAR_dev_account_email: ${{ secrets.DEV_ACCOUNT_EMAIL }}
      TF_VAR_network_account_email: ${{ secrets.NETWORK_ACCOUNT_EMAIL }}
      TF_VAR_shared_services_account_email: ${{ secrets.SHARED_SERVICES_ACCOUNT_EMAIL }}
      TF_VAR_bootstrap_admin_email: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.OIDC_ROLE_NAME }}
          aws-region: ${{ inputs.aws-region != '' && inputs.aws-region || vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version != '' && inputs.terraform-version || vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.init-upgrade }}" = "true" ]; then
            terraform init -upgrade
          else
            terraform init
          fi

      - name: Terraform Format
        working-directory: ${{ inputs.working-directory }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.working-directory }}
        run: terraform plan -input=false

      - name: Terraform Apply
        id: apply
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve -input=false
        continue-on-error: true

      - name: Commit lock file if changed
        if: always() && inputs.commit-lock-file
        working-directory: .
        run: |
          LOCK_FILE="${{ inputs.working-directory }}/.terraform.lock.hcl"
          # Normalize "./.terraform.lock.hcl" → ".terraform.lock.hcl"
          LOCK_FILE="${LOCK_FILE#./}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$LOCK_FILE" || true
          if git diff --cached --quiet; then
            echo "No lock file changes"
            exit 0
          fi

          git commit -m "chore: update terraform lock file" -m "Refresh provider lock file after apply."
          git push

      - name: Fail if Terraform Apply errored
        if: steps.apply.outcome == 'failure'
        run: exit 1
