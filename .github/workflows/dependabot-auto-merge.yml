name: dependabot-auto-merge

# Enable GitHub auto-merge for Dependabot PRs without approving them.
# Org policy may block Actions from creating PR approvals; gh --auto does not need that.
# Callers should trigger on pull_request (+ optional check_suite) and pass secrets: inherit.
# Do not add `workflows: write` to permissions — GitHub rejects it as an invalid scope.
#
# Optional secrets (via secrets: inherit) for PRs that edit `.github/workflows/*`:
#   DEPENDABOT_MERGE_APP_ID, DEPENDABOT_MERGE_APP_PRIVATE_KEY
# from the actionsforge-dependabot-merge GitHub App (workflows: write). Falls back to
# GITHUB_TOKEN when those secrets are absent.
#
# Note: `target` is a SemVer ceiling (major|minor|patch|any), not a branch name.

on:
  workflow_call:
    inputs:
      target:
        description: "SemVer auto-merge ceiling (major, minor, patch, any)"
        type: string
        required: false
        default: "any"
      merge-method:
        description: Merge method (squash, merge, rebase)
        type: string
        required: false
        default: "squash"
      use-github-auto-merge:
        description: Enable GitHub auto-merge instead of merging immediately
        type: boolean
        required: false
        default: true
      skip-verification:
        description: Skip Dependabot user/commit verification (unused; kept for callers)
        type: boolean
        required: false
        default: false
      approve-only:
        description: Only approve the PR without merging (unsupported without Actions approve permission)
        type: boolean
        required: false
        default: false
      exclude:
        description: Comma-separated packages to exclude from auto-merge
        type: string
        required: false
        default: ""
    secrets:
      DEPENDABOT_MERGE_APP_ID:
        description: App ID for actionsforge-dependabot-merge (optional)
        required: false
      DEPENDABOT_MERGE_APP_PRIVATE_KEY:
        description: PEM private key for actionsforge-dependabot-merge (optional)
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # check_suite / other events: find open Dependabot PR for this head SHA
          sha="${{ github.event.check_suite.head_sha || github.sha }}"
          num=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/dependabot" \
            --json number,headRefOid --jq ".[] | select(.headRefOid==\"$sha\") | .number" | head -n1)
          if [ -z "$num" ]; then
            echo "No open Dependabot PR for $sha; skipping"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # Secrets cannot be used in if: conditions; detect via env instead.
      - name: Detect App secrets
        id: app-secrets
        if: steps.pr.outputs.number != '' && inputs.approve-only != true
        env:
          APP_ID: ${{ secrets.DEPENDABOT_MERGE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN cannot merge PRs that modify workflow files; App token can.
      - name: Create GitHub App token
        id: app-token
        if: steps.app-secrets.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DEPENDABOT_MERGE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for Dependabot PR
        if: steps.pr.outputs.number != '' && inputs.approve-only != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR: ${{ steps.pr.outputs.number }}
          METHOD: ${{ inputs.merge-method }}
          USE_AUTO: ${{ inputs.use-github-auto-merge }}
          TARGET: ${{ inputs.target }}
          EXCLUDE: ${{ inputs.exclude }}
          USED_APP_TOKEN: ${{ steps.app-token.outcome == 'success' }}
        run: |
          set -euo pipefail

          if [ "$USED_APP_TOKEN" = "true" ]; then
            echo "Merging with actionsforge-dependabot-merge App token"
          else
            echo "Merging with GITHUB_TOKEN (no DEPENDABOT_MERGE_APP_* secrets)"
          fi

          # Optional package exclude list
          if [ -n "$EXCLUDE" ]; then
            title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
            IFS=',' read -ra pkgs <<< "$EXCLUDE"
            for pkg in "${pkgs[@]}"; do
              pkg_trim=$(echo "$pkg" | xargs)
              [ -z "$pkg_trim" ] && continue
              if echo "$title" | grep -Fqi "$pkg_trim"; then
                echo "Excluded package match ($pkg_trim); skipping auto-merge"
                exit 0
              fi
            done
          fi

          # SemVer ceiling: Dependabot titles are usually "bump X from A to B"
          # For patch/minor/major we rely on GitHub labels when present; otherwise allow any.
          case "$TARGET" in
            any|"") ;;
            patch|minor|major)
              labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name] | join(",")')
              if echo "$labels" | grep -Eqi "dependencies|github_actions|javascript|docker|npm|pip"; then
                :
              fi
              # Prefer Dependabot update-type labels if present
              if [ "$TARGET" = "patch" ] && echo "$labels" | grep -qi "semver:major\|semver:minor"; then
                echo "Target=patch but PR has higher SemVer label; skipping"
                exit 0
              fi
              if [ "$TARGET" = "minor" ] && echo "$labels" | grep -qi "semver:major"; then
                echo "Target=minor but PR has major SemVer label; skipping"
                exit 0
              fi
              ;;
            *)
              echo "Unknown target=$TARGET; treating as any"
              ;;
          esac

          method_flag="--squash"
          case "$METHOD" in
            merge) method_flag="--merge" ;;
            rebase) method_flag="--rebase" ;;
            squash) method_flag="--squash" ;;
          esac

          # Treat "already enabled / merge already in progress / clean status"
          # as success. The caller fires on multiple events (pull_request +
          # check_suite), so a later run often finds auto-merge already enabled.
          # No backticks — they expand under some runners even inside single quotes
          # when the step script is rewritten.
          # "without .?workflows.?" matches GitHub's "without `workflows` permission".
          benign='already in progress|already enabled|clean status|not mergeable: the merge commit cannot be cleanly created|without .?workflows.? permission|Protected branch rules not configured|Auto merge is not allowed for this repository|Base branch was modified'

          if [ "$USE_AUTO" = "true" ]; then
            if out=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto $method_flag 2>&1); then
              echo "Enabled auto-merge on #$PR"
            elif echo "$out" | grep -qiE "$benign"; then
              echo "GitHub auto-merge unavailable on #$PR; falling back to direct merge"
              echo "$out"
              if out2=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" $method_flag 2>&1); then
                echo "Merged #$PR (direct fallback)"
              elif echo "$out2" | grep -qiE "$benign"; then
                echo "Skipping merge on #$PR (benign / expected limitation):"
                echo "$out2"
              else
                echo "$out2" >&2
                exit 1
              fi
            else
              echo "$out" >&2
              exit 1
            fi
          else
            if out=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" $method_flag 2>&1); then
              echo "Merged #$PR"
            elif echo "$out" | grep -qiE "$benign"; then
              echo "Skipping merge on #$PR (benign / expected limitation):"
              echo "$out"
            else
              echo "$out" >&2
              exit 1
            fi
          fi
