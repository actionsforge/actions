name: astro-pages-deploy

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the Astro build
        type: string
        required: false
        default: "22"
      path:
        description: Path to the Astro project root
        type: string
        required: false
        default: "."
      validate-command:
        description: Optional command after npm ci (e.g. npm run validate)
        type: string
        required: false
        default: ""
      test-command:
        description: Optional command after npm ci (e.g. npm run test)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js
        if: inputs.validate-command != '' || inputs.test-command != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.path }}/package-lock.json

      - name: Install dependencies
        if: inputs.validate-command != '' || inputs.test-command != ''
        working-directory: ${{ inputs.path }}
        run: npm ci --no-audit --no-fund

      - name: Validate
        if: inputs.validate-command != ''
        working-directory: ${{ inputs.path }}
        run: ${{ inputs.validate-command }}

      - name: Test
        if: inputs.test-command != ''
        working-directory: ${{ inputs.path }}
        run: ${{ inputs.test-command }}

      - name: Install, build, and upload site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 #v6.1.2
        with:
          path: ${{ inputs.path }}
          node-version: ${{ inputs.node-version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.0.0
