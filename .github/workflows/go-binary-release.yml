name: go-binary-release

# Cross-compile Go binaries for configured GOOS/GOARCH pairs and publish
# them as GitHub Release assets (typically on version tags).

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version for setup-go (e.g. 1.25, stable)
        type: string
        required: false
        default: "stable"
      working-directory:
        description: Directory containing go.mod
        type: string
        required: false
        default: "."
      binary-name:
        description: Base name for release artifacts (name-goos-goarch)
        type: string
        required: true
      package:
        description: Package or main file passed to go build
        type: string
        required: false
        default: "."
      ldflags:
        description: Linker flags passed to go build -ldflags
        type: string
        required: false
        default: "-s -w"
      cgo-enabled:
        description: CGO_ENABLED value for the build; 0 produces a statically linked binary
        type: string
        required: false
        default: "0"
      trimpath:
        description: Strip build host paths and the VCS stamp for a reproducible binary
        type: boolean
        required: false
        default: true
      checksums:
        description: Write SHA256SUMS covering the built artifacts
        type: boolean
        required: false
        default: true
      platforms:
        description: Newline-separated GOOS/GOARCH pairs
        type: string
        required: false
        default: |
          linux/amd64
          darwin/amd64
          darwin/arm64
      dist-dir:
        description: Output directory for built binaries
        type: string
        required: false
        default: "dist"
      create-release:
        description: Create or update a GitHub Release and upload assets
        type: boolean
        required: false
        default: true
      generate-release-notes:
        description: Autogenerate GitHub Release notes
        type: boolean
        required: false
        default: true
      draft:
        description: Create the release as a draft
        type: boolean
        required: false
        default: false
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        required: false
        default: false
      cache:
        description: Enable setup-go module cache
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # CGO_ENABLED is exported here rather than set on the command line so the
      # build has one source for it. Leaving cgo on lets the Go resolver bind to
      # the runner's libc for DNS, which gives the published binary a runtime
      # dependency on the build host. Without -trimpath the binary embeds the
      # build machine's paths, so the same commit does not rebuild to the same
      # bytes and a published checksum asserts nothing.
      - name: Build release binaries
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          PACKAGE: ${{ inputs.package }}
          LDFLAGS: ${{ inputs.ldflags }}
          CGO_ENABLED: ${{ inputs.cgo-enabled }}
          TRIMPATH: ${{ inputs.trimpath }}
          CHECKSUMS: ${{ inputs.checksums }}
          PLATFORMS: ${{ inputs.platforms }}
          DIST_DIR: ${{ inputs.dist-dir }}
        run: |
          set -euo pipefail
          mkdir -p "${DIST_DIR}"
          build_flags=()
          if [[ "${TRIMPATH}" == "true" ]]; then
            build_flags+=(-trimpath -buildvcs=false)
          fi
          artifacts=()
          while IFS= read -r platform; do
            platform="$(echo "${platform}" | tr -d '[:space:]')"
            [[ -z "${platform}" ]] && continue
            goos="${platform%%/*}"
            goarch="${platform##*/}"
            name="${BINARY_NAME}-${goos}-${goarch}"
            # Windows will not execute a binary without the extension, so the
            # published asset has to carry it rather than be renamed on download.
            # Spelled as an if rather than a bare [[ ]] && name=... so the
            # non-Windows path leaves a zero status behind under set -e, without
            # depending on the && list exemption to stay alive.
            if [[ "${goos}" == "windows" ]]; then
              name="${name}.exe"
            fi
            out="${DIST_DIR}/${name}"
            echo "Building ${out}"
            GOOS="${goos}" GOARCH="${goarch}" go build "${build_flags[@]}" -ldflags="${LDFLAGS}" -o "${out}" ${PACKAGE}
            artifacts+=("${name}")
          done <<< "${PLATFORMS}"
          if [[ "${CHECKSUMS}" == "true" && "${#artifacts[@]}" -gt 0 ]]; then
            # Written from inside the dist dir so the names are bare, which is
            # what sha256sum -c expects beside the downloaded files.
            (cd "${DIST_DIR}" && sha256sum "${artifacts[@]}" > SHA256SUMS)
            cat "${DIST_DIR}/SHA256SUMS"
          fi
          ls -la "${DIST_DIR}"

      - name: Create Release
        if: inputs.create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ inputs.working-directory }}/${{ inputs.dist-dir }}/*
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate-release-notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
