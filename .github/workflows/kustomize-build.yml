# Reusable: discover Kustomize roots under caller-defined paths and build each one.
#
# Self-contained by design: the build loop is inline, so `uses: ...@<ref>` pins every
# line that executes. A called workflow cannot resolve its own ref, so fetching helper
# scripts from a branch would unpin callers that pin this workflow by SHA.
name: Kustomize build

on:
  workflow_call:
    inputs:
      paths:
        description: >
          Whitespace- or newline-separated paths to search (e.g. "apps" or
          "infrastructure shared"). Every kustomization root below them is built.
        type: string
        required: true
      exclude:
        description: >
          Newline-separated glob patterns matched against discovered file paths;
          a match skips that root (e.g. */vendored/*).
        type: string
        required: false
        default: ""
      kustomize-args:
        description: Extra args appended to each kustomize build (e.g. --enable-helm)
        type: string
        required: false
        default: ""
      job-name:
        description: Job display name (appears in the check name)
        type: string
        required: false
        default: "kustomize build"
      runs-on:
        description: Runner label
        type: string
        required: false
        default: "ubuntu-latest"
      kustomize-version:
        description: kustomize release to install
        type: string
        required: false
        default: "5.8.1"
      kustomize-sha256:
        description: >
          SHA-256 of the kustomize tarball for this runner's OS/arch. Empty verifies
          against the release's published checksums.txt instead.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: ${{ inputs.kustomize-version }}
          KUSTOMIZE_SHA256: ${{ inputs.kustomize-sha256 }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            ppc64le) arch=ppc64le ;;
            s390x) arch=s390x ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"

          if command -v sha256sum >/dev/null; then
            sha_check() { sha256sum -c -; }
          else
            sha_check() { shasum -a 256 -c -; }
          fi

          tarball="kustomize_v${KUSTOMIZE_VERSION}_${os}_${arch}.tar.gz"
          base_url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL -o "${work}/${tarball}" "${base_url}/${tarball}"

          # Checksum files name the tarball without a path, so verify from inside the
          # download directory; a subshell keeps the caller checkout as the cwd.
          if [[ -n "$KUSTOMIZE_SHA256" ]]; then
            (cd "$work" && echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha_check)
          else
            # Release checksums cover every published OS/arch, so version bumps and
            # non-amd64 runners do not need a hand-maintained hash.
            curl -fsSL -o "${work}/checksums.txt" "${base_url}/checksums.txt"
            (cd "$work" && grep -F " ${tarball}" checksums.txt | sha_check)
          fi

          dest="${RUNNER_TEMP}/kustomize-bin"
          mkdir -p "$dest"
          tar xzf "${work}/${tarball}" -C "$dest" kustomize

          echo "$dest" >>"$GITHUB_PATH"
          "${dest}/kustomize" version

      - name: Build discovered roots
        env:
          PATHS: ${{ inputs.paths }}
          EXCLUDE: ${{ inputs.exclude }}
          KUSTOMIZE_ARGS: ${{ inputs.kustomize-args }}
        run: |
          set -euo pipefail

          git rev-parse --is-inside-work-tree >/dev/null 2>&1 ||
            { echo "roots are discovered with git ls-files; check out the repository first" >&2; exit 1; }

          row() {
            [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || return 0
            printf '| %s | `%s` |\n' "$1" "$2" >>"$GITHUB_STEP_SUMMARY"
          }

          # PATHS, EXCLUDE, and KUSTOMIZE_ARGS are whitespace-separated lists, so they are
          # deliberately unquoted. --others --exclude-standard also finds files an earlier
          # step generated, while still honoring .gitignore.
          mapfile -t roots < <(
            git ls-files --cached --others --exclude-standard -- $PATHS |
              grep -E '(^|/)(kustomization\.yaml|kustomization\.yml|Kustomization)$' |
              while read -r file; do
                for pattern in $EXCLUDE; do
                  [[ "$file" == $pattern ]] && continue 2
                done
                dirname "$file"
              done | sort -u
          )
          if [[ "${#roots[@]}" -eq 0 ]]; then
            echo "No kustomization roots to build under: $PATHS" >&2
            exit 1
          fi

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '## Kustomize build\n\n| Result | Root |\n| --- | --- |\n' >>"$GITHUB_STEP_SUMMARY"
          fi

          failed=0
          for dir in "${roots[@]}"; do
            if output="$(kustomize build $KUSTOMIZE_ARGS "$dir" 2>&1 >/dev/null)"; then
              echo "PASS $dir"
              row PASS "$dir"
            else
              echo "FAIL $dir"
              [[ -n "$output" ]] && echo "$output"
              row FAIL "$dir"
              failed=$((failed + 1))
            fi
          done

          if [[ "$failed" -gt 0 ]]; then
            echo "${failed} of ${#roots[@]} roots failed to build." >&2
            exit 1
          fi
          echo "All ${#roots[@]} kustomize roots built."
