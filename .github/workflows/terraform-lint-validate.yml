name: terraform-lint-validate

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to the Terraform configuration directory'
        required: false
        type: string
        default: '.'

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    name: Check Terraform Formatting
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check Terraform Formatting
        uses: dflook/terraform-fmt-check@5702d43749973bd5b54e2380f090c1ad8054ecd4 #v3.0.0
        with:
          path: ${{ inputs.path }}

  validate:
    runs-on: ubuntu-latest
    name: Validate Terraform Configuration
    needs: fmt-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Validate Terraform Configuration
        uses: dflook/terraform-validate@36ef08d500fe2cd9b742b10176d2683707c7074e #v3.0.0
        with:
          path: ${{ inputs.path }}
