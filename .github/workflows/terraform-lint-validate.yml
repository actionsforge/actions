name: terraform-lint-validate

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to the Terraform configuration directory'
        required: false
        type: string
        default: '.'

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    name: Check Terraform Formatting
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check Terraform Formatting
        uses: dflook/terraform-fmt-check@af4dee16c1817cc30e44f1149dc806b8f5bc92e0 #v3.1.3
        with:
          path: ${{ inputs.path }}

  validate:
    runs-on: ubuntu-latest
    name: Validate Terraform Configuration
    needs: fmt-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Validate Terraform Configuration
        uses: dflook/terraform-validate@1a494dd58a93cf8410e7748587d60c778087b43f #v3.1.3
        with:
          path: ${{ inputs.path }}
