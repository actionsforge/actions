name: terraform-lint-validate

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to the Terraform configuration directory'
        required: false
        type: string
        default: '.'

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    name: Check Terraform Formatting
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check Terraform Formatting
        uses: dflook/terraform-fmt-check@e3f43c85d3e0a6bb3adb7be8c423c22c42d572bd #v3.1.0
        with:
          path: ${{ inputs.path }}

  validate:
    runs-on: ubuntu-latest
    name: Validate Terraform Configuration
    needs: fmt-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Validate Terraform Configuration
        uses: dflook/terraform-validate@29a791ea3e8c3a7c0157bb21aba5a6ca59a69d6d #v3.1.0
        with:
          path: ${{ inputs.path }}
