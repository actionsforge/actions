name: validate-devschema

on:
  workflow_call:
    inputs:
      schema:
        description: Path or URL to the JSON schema.
        required: false
        type: string
        default: "https://raw.githubusercontent.com/devcontainers/spec/main/schemas/devContainer.schema.json"
      data:
        description: Path or URL to the JSON data.
        required: false
        type: string
        default: ".devcontainer/devcontainer.json"
      verbose:
        description: Enable verbose output.
        required: false
        type: boolean
        default: false
      python-version:
        description: |
          Python version to use. Must be one of:
          3.9, 3.10, 3.11, 3.12, 3.13
        required: false
        type: string
        default: "3.13"

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Resolve paths against workspace
        id: paths
        env:
          SCHEMA: ${{ inputs.schema }}
          DATA: ${{ inputs.data }}
        run: |
          resolve() {
            local value="$1"
            if [[ "$value" == http://* || "$value" == https://* || "$value" == /* ]]; then
              printf '%s' "$value"
            else
              printf '%s/%s' "$GITHUB_WORKSPACE" "$value"
            fi
          }
          echo "schema=$(resolve "$SCHEMA")" >> "$GITHUB_OUTPUT"
          echo "data=$(resolve "$DATA")" >> "$GITHUB_OUTPUT"

      - name: Validate Devcontainer Schema
        uses: actionsforge/actions-validate-devschema@v1
        with:
          schema: ${{ steps.paths.outputs.schema }}
          data: ${{ steps.paths.outputs.data }}
          verbose: ${{ inputs.verbose }}
          python-version: ${{ inputs.python-version }}
