name: Chart Lint and Validate

on:
  workflow_call:
    inputs:
      chart_dirs:
        description: "Chart directory relative to repository root (passed to ct --chart-dirs)"
        type: string
        required: false
        default: "charts"
      target_branch:
        description: "Target branch for chart-testing (defaults to repository default branch)"
        type: string
        required: false
        default: ""
      helm_version:
        description: "Helm version (e.g., 3.15.4 or latest)"
        type: string
        required: false
        default: "latest"
      python_version:
        description: "Python version for chart-testing"
        type: string
        required: false
        default: "3.x"
      run_lint:
        description: "Run chart lint validation"
        type: boolean
        required: false
        default: true
      run_install:
        description: "Run chart install validation"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.target_branch }}" ]]; then
            echo "branch=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 #v5.0.1
        with:
          version: ${{ inputs.helm_version || 'latest' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: ${{ inputs.python_version || '3.x' }}
          check-latest: true

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 #v2.9.0

      - name: Run Chart-Testing (list-changed)
        id: list-changed
        shell: bash
        run: |
          set -euo pipefail
          changed=$(ct list-changed \
            --target-branch "${{ steps.target.outputs.branch }}" \
            --chart-dirs "${{ inputs.chart_dirs }}")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Chart-Testing (lint)
        if: ${{ steps.list-changed.outputs.changed == 'true' && inputs.run_lint }}
        shell: bash
        run: |
          set -euo pipefail
          ct lint \
            --target-branch "${{ steps.target.outputs.branch }}" \
            --chart-dirs "${{ inputs.chart_dirs }}"

      - name: Create Kind cluster
        if: ${{ steps.list-changed.outputs.changed == 'true' && inputs.run_install }}
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa #v1.15.1

      - name: Run Chart-Testing (install)
        if: ${{ steps.list-changed.outputs.changed == 'true' && inputs.run_install }}
        shell: bash
        run: |
          set -euo pipefail
          ct install \
            --target-branch "${{ steps.target.outputs.branch }}" \
            --chart-dirs "${{ inputs.chart_dirs }}"
