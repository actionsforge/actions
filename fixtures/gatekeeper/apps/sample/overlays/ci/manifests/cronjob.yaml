apiVersion: v1
kind: Namespace
metadata:
  name: sample
  labels:
    name: sample
    owner: devops
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sample
  namespace: sample
  labels:
    app.kubernetes.io/name: sample
    owner: devops
spec:
  schedule: "0 0 * * *"
  timeZone: Pacific/Auckland
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sample
            owner: devops
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pause
              image: public.ecr.aws/docker/library/busybox:1.36
              command: ["true"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
